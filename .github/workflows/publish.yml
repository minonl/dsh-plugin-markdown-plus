# 通过 npm Trusted Publishing（OIDC）发布：无需 NPM_TOKEN，无需 OTP。
#
# 前提（npmjs.com 包设置里配置一次，见 docs/release.md）：
#   Trusted Publisher = GitHub Actions
#     Organization or user: minonl
#     Repository:           dsh-plugin-markdown-plus
#     Workflow filename:    publish.yml
#     Allowed actions:      npm publish（勾选）
#
# 触发：推送形如 v0.1.0 / v0.1.0-beta.0 的 tag。
# 版本一致性：tag 去掉前导 v 必须等于 package.json 的 version，否则失败（防止 tag 与产物漂移）。
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC：Trusted Publishing + 自动 provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted Publishing 要求 npm >= 11.5.1（Node 22 自带 npm 10.x，会静默跳过 OIDC 交换）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # 闸门：typecheck + 测试 + 三段构建（构建脚本内含产物自检）
      - run: bun run typecheck
      - run: bun test --preload ./test/preload.ts
      - run: bun run build

      # 发布：provenance 由 Trusted Publishing 自动附带（package.json 也声明了 publishConfig.provenance）
      # 预发布版本自动打 beta tag，正式版本走 latest
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=beta ;;
            *)   TAG=latest ;;
          esac
          echo "publishing $VERSION with dist-tag $TAG"
          npm publish --tag "$TAG" --access public
