# 发布通道 —— 单文件双入口（npm Trusted Publishing 按「workflow 文件名」授权，所以两条通道共用本文件）
#
# ① 推送 tag `v*`（如 v0.1.0 / v0.1.0-beta.1）
#    → 版本取 package.json（必须与 tag 一致，否则失败），dist-tag：含 `-` → beta，否则 latest
# ② 手动 workflow_dispatch
#    → 实验包，版本 = `<base_version>-experimental.<GITHUB_RUN_NUMBER>`，dist-tag：experimental
#
# 凭据：npm Trusted Publishing（OIDC）——无需 NPM_TOKEN，也无需 OTP。
#   前提：npmjs.com 包设置的 Trusted Publisher 指向本文件 `publish.yml`（见 docs/release.md）。
#   首次发布不能 OIDC 自举（包还不存在），必须人工手动发一版，步骤见 docs/release.md。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_version:
        description: '实验包基线版本（形如 0.0.0 / 0.1.0）'
        required: true
        default: '0.0.0'
        type: string

permissions:
  id-token: write   # OIDC：Trusted Publishing + 自动 provenance
  contents: read

# 两条通道串行，避免并发 CLI 抢同一份 registry 状态
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # npm 通道开关：仓库变量 NPM_PUBLISH_ENABLED=true 时才在 tag 上发布。
    # 为什么：tarball 通道（release.yml）不需要 npm，npm 账号异常时不应让 tag 构建变红。
    # 手动触发（workflow_dispatch）不受此开关限制（实验包是显式操作）。
    if: github.event_name == 'workflow_dispatch' || vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted Publishing 要求 npm >= 11.5.1（Node 22 自带 npm 10.x 会静默跳过 OIDC 交换）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm < 11.5.1 没有 OIDC 交换能力（会静默降级成匿名 → 404/ENEEDAUTH）
      - name: 确保 npm >= 11.5.1
        run: |
          npm install -g npm@latest
          v=$(npm -v); echo "npm $v"; major=${v%%.*}
          [ "$major" -ge 11 ] || { echo "::error::npm $v 不支持 trusted publishing"; exit 1; }

      # setup-node 会写 `_authToken=${NODE_AUTH_TOKEN}` 占位；没有 token 时 npm 看到它就
      # 不走 OIDC（npm/documentation#1960）。删掉这一行，保留 registry。
      - name: 去掉占位 token，让 npm 走 OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc" || true
          grep -c "_authToken" "$npmrc" || true

      # 交换诊断：只打印状态码，不打印 token/响应体
      - name: OIDC preflight
        run: |
          set -u
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::缺少 id-token 环境变量（检查 permissions: id-token: write）"; exit 1
          fi
          ID=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("value",""))')
          [ -n "$ID" ] || { echo "::error::拿不到 OIDC token"; exit 1; }
          PKG=$(node -p "require('./package.json').name" | sed 's#/#%2f#')
          code=$(curl -s -o /tmp/ex.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ID" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG")
          echo "exchange status: $code"
          [ "$code" = "200" ] || { echo "--- body ---"; head -c 500 /tmp/ex.json; exit 1; }

      - name: Resolve version and dist-tag
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base_version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            PKG=$(node -p "require('./package.json').version")
            echo "tag=$TAG package.json=$PKG"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag $TAG does not match package.json version $PKG"
              exit 1
            fi
            VERSION="$PKG"
            case "$VERSION" in
              *-*) DIST_TAG=beta ;;
              *)   DIST_TAG=latest ;;
            esac
          else
            if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::base_version 必须形如 1.2.3（收到：$BASE）"
              exit 1
            fi
            VERSION="${BASE}-experimental.${GITHUB_RUN_NUMBER}"
            DIST_TAG=experimental
            # 只改工作区 package.json，不提交、不打 tag：版本号的事实源是「本次运行」
            npm pkg set "version=$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "resolved $VERSION (dist-tag: $DIST_TAG)"

      - run: bun install --frozen-lockfile

      # 闸门：类型 + 测试 + 三段构建（构建脚本内含产物契约自检）
      - run: bun run typecheck
      - run: bun test --preload ./test/preload.ts
      - run: bun run build

      # 发包内容闸门：tarball 必须含 dist/ + cordis.patch.yml，且不夹带源码/测试/构建产物
      - run: node scripts/check-tarball.mjs

      # 发布：OIDC 换取短期凭据，provenance 自动附带（不需 --provenance）
      - name: Publish
        env:
          DIST_TAG: ${{ steps.ver.outputs.dist_tag }}
        run: |
          set -euo pipefail
          echo "publishing $(node -p "require('./package.json').version") with dist-tag $DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public

      # registry 传播有秒级延迟，重试确认「装得到」才算发成功
      - name: Verify on registry
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          for i in $(seq 1 60); do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              npm view "$PKG@$VERSION" version dist.tarball
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PKG@$VERSION 在 registry 上查不到（重试 60 次 / 5 分钟）"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### publish"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| dist-tag | \`${{ steps.ver.outputs.dist_tag }}\` |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| ref | \`${GITHUB_REF_NAME}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
